<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}管理{% endblock %} · 博客</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1a1d26; --muted:#5c6478; --line:#e2e6ef; --accent:#2563eb; }
    body { margin:0; font-family: ui-sans-serif, system-ui, Roboto, "PingFang SC", sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.75rem; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid var(--line); }
    header h1 { margin:0; font-size:1.15rem; }
    header nav a { margin-right:0.65rem; font-size:0.9rem; color:var(--muted); text-decoration:none; }
    header nav a:hover { color: var(--accent); text-decoration:underline; }
    .flash { padding:0.55rem 0.7rem; border-radius:8px; margin-bottom:0.65rem; font-size:0.88rem; border:1px solid var(--line); background:#fff; }
    .flash.ok { border-color:#bbf7d0; background:#ecfdf5; color:#166534; }
    .flash.error { border-color:#fecaca; background:#fef2f2; color:#991b1b; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem; }
    label { display:block; font-size:0.78rem; color:var(--muted); margin:0.4rem 0 0.15rem; }
    input, select, textarea { width:100%; max-width:32rem; padding:0.45rem 0.5rem; border:1px solid var(--line); border-radius:8px; font:inherit; }
    textarea { min-height: 200px; font-family: ui-monospace, Menlo, monospace; font-size:0.86rem; }
    button, .btn { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:#fff; padding:0.35rem 0.65rem; font-size:0.88rem; text-decoration:none; color:inherit; display:inline-block; }
    button.primary, .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.danger { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
    table { width:100%; border-collapse:collapse; font-size:0.86rem; }
    th, td { text-align:left; padding:0.4rem 0.3rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.03em; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    form.inline { display:inline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><a href="{{ url_for('blog_admin.posts') }}" style="color:inherit;text-decoration:none;">博客管理</a></h1>
      <nav>
        <a href="{{ url_for('blog.index') }}">前台</a>
        {% if current_user() %}
        <a href="{{ url_for('blog_admin.posts') }}">文章</a>
        <a href="{{ url_for('blog_admin.comments') }}">评论</a>
        <a href="{{ url_for('blog_admin.change_password') }}">改密</a>
        <form class="inline" method="post" action="{{ url_for('blog_admin.logout') }}" style="display:inline;">
          <button type="submit">退出</button>
        </form>
        {% else %}
        <a href="{{ url_for('blog_admin.login') }}">登录</a>
        {% endif %}
      </nav>
    </header>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
