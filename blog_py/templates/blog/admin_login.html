{% extends "blog/admin_base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
  <div class="card" style="max-width:22rem;">
    <h2 style="margin-top:0; font-size:1rem;">管理员登录</h2>
    <form method="post" action="{{ url_for('blog_admin.login') }}">
      <input type="hidden" name="next" value="{{ (request.args.get('next') or '')|e }}" />
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p style="margin-top:0.75rem;"><button type="submit" class="primary">登录</button></p>
    </form>
  </div>
{% endblock %}
