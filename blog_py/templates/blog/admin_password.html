{% extends "blog/admin_base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
  <div class="card" style="max-width:22rem;">
    <h2 style="margin-top:0; font-size:1rem;">修改密码</h2>
    <form method="post">
      <label for="old_password">当前密码</label>
      <input id="old_password" name="old_password" type="password" required autocomplete="current-password" />
      <label for="new_password">新密码（至少 6 位）</label>
      <input id="new_password" name="new_password" type="password" required minlength="6" autocomplete="new-password" />
      <p style="margin-top:0.75rem;"><button type="submit" class="primary">更新</button></p>
    </form>
  </div>
{% endblock %}
